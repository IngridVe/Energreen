name: Wekelijkse mediamonitoring

on:
  schedule:
    # 06:45 UTC = 08:45 Brusselse tijd in de zomer, 07:45 in de winter
    - cron: "45 6 * * 5"
  workflow_dispatch:
    inputs:
      dagen:
        description: "Aantal dagen terugkijken"
        required: false
        default: "7"

permissions:
  contents: write

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakketten installeren
        run: pip install feedparser openpyxl

      - name: Monitoring draaien
        run: python scripts/monitor.py --dagen "${{ github.event.inputs.dagen || '7' }}"

      - name: Resultaat als download bewaren
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-overzicht
          path: output/*.xlsx
          retention-days: 90

      - name: Resultaat in de repository vastleggen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Monitoring $(date -u +%Y-%m-%d)"
          git push
